# ms-ventas/src/main/resources/application.properties
spring.application.name=ms-ventas
server.port=8083

# Base de datos propia de ms-ventas
spring.datasource.url=jdbc:mysql://localhost:3306/poketienda_ventas
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Clave compartida para validar tokens JWT
jwt.secret=${JWT_SECRET}

# URL de ms-productos (nunca escrita en el código)
ms-productos.url=http://localhost:8082/api/v1